<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Smythe&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Jimmy's Diner</h1>
        <h2 class="tagline">The best burgers and pizzas in town.</h2>
      </header>
      <section class="menu"></section>
      <section class="order-details">
        <h2>Your order</h2>
        <div class="order-list"></div>
        <div class="total-section">
          <span>Total price:</span>
          <span class="price">$26</span>
        </div>
        <button class="green-btn" id="order-btn">Complete order</button>
      </section>
      <div class="modal hidden">
        <h2>Enter card details</h2>
        <form id="payment-form" class="payment-form">
          <input
            type="text"
            placeholder="Enter your name"
            aria-label="name"
            required
          />
          <input
            type="text"
            placeholder="Enter card number"
            aria-label="card-number"
            inputmode="numeric"
            pattern="[0-9]{13,19}"
            maxlength="19"
            title="Enter 13 to 19 digits"
            required
          />
          <input
            type="text"
            placeholder="Enter CVV"
            aria-label="cvv"
            inputmode="numeric"
            pattern="[0-9]{3,4}"
            maxlength="4"
            title="Enter 3 or 4 digits"
            required
          />
          <button class="green-btn" id="pay-btn" type="submit">Pay</button>
        </form>
      </div>
      <div class="confirmation hidden">
        <p>Thanks, James! Your order is on its way!</p>
      </div>
    </div>
    <script src="index.js" type="module"></script>
  </body>
</html>
